name: Deploy to Heroku

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: heroku-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure container stack and push source to Heroku
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP_NAME: ${{ secrets.HEROKU_APP_NAME }}
        run: |
          test -n "$HEROKU_API_KEY" || { echo "Missing HEROKU_API_KEY secret"; exit 1; }
          test -n "$HEROKU_APP_NAME" || { echo "Missing HEROKU_APP_NAME secret"; exit 1; }
          curl --fail-with-body --silent --show-error --request PATCH \
            "https://api.heroku.com/apps/${HEROKU_APP_NAME}" \
            --header "Accept: application/vnd.heroku+json; version=3" \
            --header "Authorization: Bearer ${HEROKU_API_KEY}" \
            --header "Content-Type: application/json" \
            --data '{"build_stack":"container"}' \
            > /dev/null
          git push --force "https://heroku:${HEROKU_API_KEY}@git.heroku.com/${HEROKU_APP_NAME}.git" HEAD:main
